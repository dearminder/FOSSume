# Builds a signed APK and publishes it as a release for every version tag (1.0.1, 1.0.2, 1.0.3...).
# A tag that already has a release is skipped, and Actions > Release > Run workflow on a tagged commit
# retries its release. versionCode is the commit count, so every release installs as an update.
# On Forgejo/Gitea Actions a push to main also picks the next version (the last tag + 1) and tags it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore, base64-encoded (base64 -w0 release.jks)
#   SIGNING_STORE_PASSWORD   its password
#   SIGNING_KEY_ALIAS        the key's alias
#   SIGNING_KEY_PASSWORD     the key's password
# The RUNS_ON repository variable picks a runner label other than ubuntu-latest.
name: Release

on:
  push:
    branches: [main]
    tags: ['*.*.*']
    paths-ignore: ['**.md']
  workflow_dispatch:

# Two quick pushes would otherwise both pick the same version.
concurrency: release

permissions:
  contents: write

jobs:
  release:
    # On GitHub releases come from version tags, not from pushes to main.
    if: github.server_url != 'https://github.com' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    env:
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history and tags, for the commit count and the last version

      - name: Work out the version
        run: |
          if [ "$GITHUB_SERVER_URL" = https://github.com ]; then forge=github; else forge=forgejo; fi
          echo "FORGE=$forge" >> "$GITHUB_ENV"
          echo "API=${GITHUB_API_URL:-$GITHUB_SERVER_URL/api/v1}/repos/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

          tags=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          here=$(git tag -l --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          last=$(echo "$tags" | tail -n1)
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            version=${GITHUB_REF#refs/tags/}
          elif [ -n "$here" ]; then
            version=$here # this commit was released already, or its release failed - retry it
          elif [ "$forge" = github ]; then
            echo "::error::This commit has no version tag to release"
            exit 1
          elif [ -z "$last" ]; then
            version=1.0.1
          else
            version="${last%.*}.$(( ${last##*.} + 1 ))"
          fi
          previous=$( (echo "$tags"; echo "$version") | sort -uV | grep -B1 -xF "$version" | grep -vxF "$version" || true)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Check for an existing release
        run: |
          if [ "$FORGE" = github ]; then
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$API/releases/tags/$VERSION")
          else
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $TOKEN" "$API/releases/tags/$VERSION")
          fi
          if [ "$status" = 200 ]; then
            echo "Release $VERSION already exists, nothing to do"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/setup-build
        if: env.SKIP != 'true'

      - name: Decode the signing keystore
        if: env.SKIP != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set - see the top of this workflow"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP:-/tmp}/release.jks"
          echo "SIGNING_KEYSTORE_FILE=${RUNNER_TEMP:-/tmp}/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        if: env.SKIP != 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

      - name: Upload reports
        if: failure()
        continue-on-error: true # older Forgejo versions can't take artifacts from upload-artifact v4+
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/

      - name: Publish the release
        if: env.SKIP != 'true'
        run: |
          apk="FOSSume-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

          if [ "$FORGE" = github ]; then
            GH_TOKEN=$TOKEN gh release create "$VERSION" "$apk" "$apk.sha256" --target "$GITHUB_SHA" \
              --title "FOSSume $VERSION" --generate-notes
            exit 0
          fi

          # Forgejo has no gh and no generated notes: create the release (and its tag) through the API,
          # with a link to the changes since the previous version, then attach the files.
          notes=""
          if [ -n "$PREVIOUS" ]; then
            notes="Changes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$VERSION"
          fi
          id=$(curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$VERSION\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"FOSSume $VERSION\",\"body\":\"$notes\"}" \
            "$API/releases" | grep -o '"id":[0-9]*' | head -n1 | cut -d: -f2)
          for file in "$apk" "$apk.sha256"; do
            curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" "$API/releases/$id/assets?name=$file"
          done

      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP:-/tmp}/release.jks"
